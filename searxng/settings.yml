# SearXNG settings.yml
# Minimal configuration for MCP server backend
# JSON format MUST be enabled for MCP to read results

# Inherits SearXNG defaults (prevents missing key errors)
use_default_settings: true

general:
  instance_name: "mcp-search-local"
  debug: false
  privacy:
    store_json_result: false

search:
  formats:
    - html
    - json

server:
  # Bind to 0.0.0.0 so Docker can receive connections
  bind_address: "0.0.0.0"
  # Internal port (docker-compose maps 8080 -> 4000)
  port: 8080
  # Timeout for querying external engines
  method: "GET"
  # No authentication required
  secret_key: "change-me-in-production"

ui:
  static_use_hash: true

# Active engines — disable some to reduce latency
# More engines = slower response (but more results)
engines:
  # Google is the most important engine (best results)
  - name: google
    shortcut: g
    disabled: false

  # DuckDuckGo as primary fallback (no API key needed)
  - name: duckduckgo
    shortcut: d
    disabled: false

  # Brave Search (free, decent results)
  - name: brave
    shortcut: b
    disabled: false

  # Wikipedia for encyclopedic results
  - name: wikipedia
    shortcut: wp
    disabled: false

  # arXiv for academic papers
  - name: arxiv
    shortcut: ar
    disabled: false

# Cache via Valkey (reduces latency on repeated queries)
redis:
  url: "redis://valkey:6379/0"
