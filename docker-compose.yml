# docker-compose.yml
# SearXNG (metasearch engine) + Valkey (cache)
# MCP server queries SearXNG via HTTP API on localhost:4000
# SearXNG queries Google, DuckDuckGo, Brave, etc.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng-core
    ports:
      # Expose SearXNG API on host port 4000
      # MCP server sends requests to http://localhost:4000/search
      - "4000:8080"
    volumes:
      # Mount custom SearXNG configuration
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      # Persist favicon cache across restarts
      - searxng-data:/var/cache/searxng
    environment:
      # Disable debug mode in production
      - SEARXNG_DEBUG=false
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_started

  valkey:
    # Valkey is SearXNG's cache (Redis fork)
    # Reduces latency on repeated queries
    image: valkey/valkey:8
    container_name: searxng-valkey
    volumes:
      - valkey-data:/data
    restart: unless-stopped

volumes:
  searxng-data:
  valkey-data:
